<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Player | Amazon KDP Simplified</title>
  <meta name="description" content="Watch video lessons and mark progress in Amazon KDP Simplified.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F5C542'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/></svg>">
  <script src="https://fast.wistia.net/assets/external/E-v1.js" async></script>
</head>
<body class="player-page-body">

  <!-- Top Bar -->
  <header class="player-topbar">
    <div style="display:flex; align-items:center; gap:0.85rem;">
      <a href="dashboard.html" class="btn btn-outline btn-sm" title="Return to Dashboard">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Dashboard</span>
      </a>
      <span style="font-size:0.925rem; font-weight:600; color:var(--text-white);" class="player-topbar-title">
        Amazon KDP Simplified
      </span>
    </div>

    <div style="display:flex; align-items:center; gap:1rem;">
      <span id="topbar-lesson-indicator" style="font-size:0.8125rem; color:var(--accent-yellow); font-weight:600;">
        Lesson 1 of 10
      </span>
      <a href="#" class="btn btn-whatsapp btn-sm whatsapp-support-link">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        <span class="desktop-only">WhatsApp</span>
      </a>
    </div>
  </header>

  <!-- Player Layout -->
  <div class="player-layout">

    <!-- Left Sidebar: Lessons Navigation -->
    <aside class="player-sidebar" aria-label="Course Lessons">
      <div class="sidebar-header">
        <div class="sidebar-title-row">
          <h3>Course Curriculum</h3>
          <span class="sidebar-count">10 Lessons</span>
        </div>
        <div class="sidebar-progress">
          <div class="sidebar-progress-track"><div id="sidebar-progress-fill" class="sidebar-progress-fill"></div></div>
          <span id="sidebar-progress-text">0 of 10 completed</span>
        </div>
      </div>
      
      <div id="player-lessons-list">
        <!-- Rendered dynamically by js/course.js -->
      </div>
    </aside>

    <!-- Center/Main: Video Player & Content -->
    <main class="player-main-area">
      <!-- Wistia Video Embed Container -->
      <div class="player-video-container">
        <div id="wistia-embed-target"></div>
      </div>

      <!-- Controls & Metadata Content -->
      <div class="player-content-body">
        
        <!-- Navigation Buttons & Mark Complete -->
        <div class="player-nav-controls">
          <div style="display:flex; gap:0.5rem;">
            <button id="btn-prev-lesson" class="btn btn-secondary btn-sm" disabled>
              <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
              <span>Previous</span>
            </button>
            <button id="btn-next-lesson" class="btn btn-secondary btn-sm">
              <span>Next</span>
              <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
          </div>

          <div>
            <button id="btn-mark-complete" class="btn btn-primary">
              <span class="icon-inline">
                <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </span>
              <span>Mark as Completed</span>
            </button>
          </div>
        </div>

        <!-- Lesson Text Information -->
        <div class="lesson-info-box">
          <div class="lesson-meta-chips">
            <span id="lesson-chip-number" class="lesson-chip lesson-chip-accent">Lesson 1</span>
            <span id="lesson-chip-duration" class="lesson-chip"></span>
            <span id="lesson-chip-status" class="lesson-chip"></span>
          </div>
          <h1 id="player-lesson-title">Loading Lesson...</h1>
          <p id="player-lesson-desc" class="lesson-desc"></p>
        </div>

        <!-- Important Notes & Key Takeaways Card -->
        <div class="lesson-notes-card">
          <h3 style="display:flex; align-items:center; gap:0.4rem;">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <span>Important Notes & Action Steps</span>
          </h3>
          <div id="player-lesson-notes" class="lesson-notes-content"></div>
        </div>

        <!-- WhatsApp Support Callout -->
        <div style="background:#141417; border:1px solid var(--border-dark); border-radius:12px; padding:1.25rem; margin-top:2rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
          <div>
            <div style="font-weight:600; color:var(--text-white); font-size:0.95rem;">Have questions about this lesson?</div>
            <div style="font-size:0.85rem; color:var(--text-secondary-dark);">Ask directly inside our private student WhatsApp group for personal feedback.</div>
          </div>
          <a href="#" class="btn btn-whatsapp btn-sm whatsapp-support-link">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
            <span>Open WhatsApp Group</span>
          </a>
        </div>

      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/course.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initCoursePlayer();
    });
  </script>
</body>
</html>
