<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile & Settings | Amazon KDP Simplified</title>
  <meta name="description" content="Manage your account profile, password, and course status.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F5C542'><path d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/><circle cx='12' cy='7' r='4'/></svg>">
</head>
<body class="admin-body">

  <header class="admin-topbar">
    <div class="admin-topbar-inner student-topbar-inner">
      <a href="dashboard.html" class="brand-logo admin-brand">
        <span class="icon-inline" style="color:var(--accent-yellow);">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </span>
        <span>KDP <span class="logo-accent">Simplified</span></span>
      </a>
      <div class="admin-topbar-actions">
        <a href="dashboard.html" class="admin-link"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg><span>My course</span></a>
        <button onclick="logoutUser()" class="admin-icon-btn" title="Log out" aria-label="Log out">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="section-sm">
    <div class="container container-reading">
      
      <div style="margin-bottom:2rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
        <div>
          <h1 style="font-size:1.9rem; margin-bottom:0.25rem;">My Account & Security</h1>
          <p style="color:var(--text-secondary-dark); font-size:0.9rem;">Course access details and device registration</p>
        </div>
      </div>

      <div id="profile-alert" class="form-alert"></div>

      <!-- Profile Overview Card -->
      <div style="background-color:var(--bg-card); border:1px solid var(--border-dark); border-radius:var(--radius-card); padding:2rem; margin-bottom:2rem;">
        <h3 style="font-size:1.2rem; margin-bottom:1.25rem; color:var(--text-white); display:flex; align-items:center; gap:0.5rem;">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Account Information</span>
        </h3>
        
        <div class="profile-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1.5rem;">
          <div>
            <span style="font-size:0.775rem; color:var(--text-secondary-dark); display:block; text-transform:uppercase;">Full Name</span>
            <strong id="profile-name-display" style="font-size:1.05rem; color:var(--text-white);">-</strong>
          </div>
          <div>
            <span style="font-size:0.775rem; color:var(--text-secondary-dark); display:block; text-transform:uppercase;">Registered Email</span>
            <strong class="profile-email" id="profile-email-display" style="font-size:1.05rem; color:var(--text-white);">-</strong>
          </div>
          <div>
            <span style="font-size:0.775rem; color:var(--text-secondary-dark); display:block; text-transform:uppercase;">Enrollment Access</span>
            <div id="profile-status-badge" style="margin-top:0.35rem;">
              <span class="status-badge active">ACTIVE</span>
            </div>
          </div>
          <div>
            <span style="font-size:0.775rem; color:var(--text-secondary-dark); display:block; text-transform:uppercase;">Devices</span>
            <div style="margin-top:0.35rem; font-size:0.875rem; color:#6EE7B7; display:flex; align-items:center; gap:0.35rem;">
              <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <span id="profile-devices-display">This device</span>
            </div>
          </div>
        </div>

        <div style="border-top:1px solid var(--border-dark); padding-top:1rem; font-size:0.85rem; color:var(--text-muted-dark); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
          <span>Course: <strong>Amazon KDP Simplified</strong></span>
          <span id="profile-completion-display" style="color:var(--accent-yellow); font-weight:600;">-</span>
        </div>
      </div>

      <!-- Change Password Card -->
      <div style="background-color:var(--bg-card); border:1px solid var(--border-dark); border-radius:var(--radius-card); padding:2rem;">
        <h3 style="font-size:1.2rem; margin-bottom:1.25rem; color:var(--text-white); display:flex; align-items:center; gap:0.5rem;">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="16.5" r="1.5"></circle><path d="M21 2l-2 2m-1.5 1.5L14 9l-3-3L2 15l4 4 9-9 3.5-3.5z"></path></svg>
          <span>Update Password</span>
        </h3>
        
        <form id="profile-password-form">
          <div class="form-group">
            <label class="form-label" for="profile-new-password">New Password</label>
            <input type="password" id="profile-new-password" class="form-input" placeholder="At least 6 characters" minlength="6" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="profile-confirm-password">Confirm New Password</label>
            <input type="password" id="profile-confirm-password" class="form-input" placeholder="Repeat new password" minlength="6" required>
          </div>

          <button type="submit" id="btn-update-pass" class="btn btn-primary profile-submit" style="margin-top:1rem;">
            Update Password
          </button>
        </form>
      </div>

    </div>
  </main>

  <footer class="dash-footer">
    &copy; <span class="current-year">2026</span> Thokerunga Innocent &bull; <a href="terms.html">Terms</a> &bull; <a href="privacy.html">Privacy</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/course.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireAuth();
      if (!user) return;

      document.getElementById('profile-name-display').textContent = user.full_name;
      document.getElementById('profile-email-display').textContent = user.email;

      const statusBadgeContainer = document.getElementById('profile-status-badge');
      const statusClass = user.enrollment_status === 'active' ? 'active' : 'inactive';
      statusBadgeContainer.innerHTML = `
        <span class="status-badge ${statusClass}">
          ${user.enrollment_status ? user.enrollment_status.toUpperCase() : 'INACTIVE'}
        </span>
      `;

      // Devices used (max per account)
      const devicesEl = document.getElementById('profile-devices-display');
      if (devicesEl) {
        const used = getDeviceList(user).length;
        const max = APP_CONFIG.MAX_DEVICES || 3;
        devicesEl.textContent = user.is_admin ? 'No limit (admin)' : `${Math.max(used, 1)} of ${max} used`;
      }

      // Fetch progress
      await loadCourseLessons();
      const total = APP_CONFIG.LESSONS_DATA.length;
      const completedList = (await getStudentProgress(user.id)).filter(n => APP_CONFIG.LESSONS_DATA.some(l => l.number === n));
      document.getElementById('profile-completion-display').textContent =
        `${completedList.length} of ${total} lessons finished (${total ? Math.round((completedList.length / total) * 100) : 0}%)`;

      // Password form handler
      const passForm = document.getElementById('profile-password-form');
      const passBtn = document.getElementById('btn-update-pass');
      const alertBox = document.getElementById('profile-alert');

      passForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('profile-new-password').value;
        const p2 = document.getElementById('profile-confirm-password').value;

        if (p1 !== p2) {
          alertBox.className = 'form-alert alert-error';
          alertBox.textContent = 'Passwords do not match.';
          alertBox.style.display = 'block';
          return;
        }

        passBtn.disabled = true;
        passBtn.textContent = 'Updating...';
        alertBox.style.display = 'none';

        try {
          await updatePassword(p1);
          alertBox.className = 'form-alert alert-success';
          alertBox.textContent = 'Password successfully updated!';
          alertBox.style.display = 'block';
          passForm.reset();
        } catch (err) {
          alertBox.className = 'form-alert alert-error';
          alertBox.textContent = err.message || 'Failed to update password.';
          alertBox.style.display = 'block';
        } finally {
          passBtn.disabled = false;
          passBtn.textContent = 'Update Password';
        }
      });
    });
  </script>
</body>
</html>
