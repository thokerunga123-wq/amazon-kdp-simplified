<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Course | Amazon KDP Simplified</title>
  <meta name="description" content="Your Amazon KDP Simplified lessons and progress.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
</head>
<body class="admin-body student-body">

  <!-- Top bar -->
  <header class="admin-topbar">
    <div class="admin-topbar-inner student-topbar-inner">
      <a href="dashboard.html" class="brand-logo admin-brand">
        <img src="assets/images/logo.webp" alt="KDP Simplified" class="brand-logo-img" width="460" height="132">
      </a>

      <div class="admin-topbar-actions">
        <a href="admin.html" class="admin-link" id="dash-admin-link" hidden>
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          <span class="admin-hide-sm">Admin</span>
        </a>
        <a href="profile.html" class="admin-user admin-user-link" title="My account">
          <span class="admin-avatar" id="dash-avatar">S</span>
          <span class="admin-user-name admin-hide-sm" id="dash-user-name">Student</span>
        </a>
        <button onclick="logoutUser()" class="admin-icon-btn" title="Log out" aria-label="Log out">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="admin-main student-main">

    <!-- Greeting + progress -->
    <section class="dash-hero">
      <div>
        <p class="dash-eyebrow">Amazon KDP Simplified</p>
        <h1>Welcome back, <span id="dash-student-name">Student</span></h1>
      </div>
      <div class="dash-progress" aria-label="Course progress">
        <div class="dash-progress-ring" id="dash-progress-ring" style="--pct:0">
          <span id="progress-percent">0%</span>
        </div>
        <div>
          <div class="dash-progress-title" id="progress-count">Loading your progress…</div>
          <div class="dash-progress-sub" id="progress-sub">Let's get your first book started.</div>
        </div>
      </div>
    </section>

    <!-- Access pending notice (only shown when needed) -->
    <div id="enrollment-status-alert" class="dash-alert" hidden></div>

    <!-- Continue card -->
    <a href="lesson.html?lesson=1" id="btn-continue-learning" class="dash-continue">
      <div class="dash-continue-thumb" id="dash-continue-thumb">
        <span class="dash-continue-play"><svg viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg></span>
      </div>
      <div class="dash-continue-body">
        <span class="dash-continue-label" id="dash-continue-label">Start here</span>
        <h2 id="dash-continue-title">Lesson 1</h2>
        <p id="dash-continue-desc"></p>
        <span class="dash-continue-cta"><span id="dash-continue-cta-text">Start lesson</span>
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </span>
      </div>
    </a>

    <!-- Lessons -->
    <section class="dash-section">
      <div class="dash-section-head">
        <h2>All lessons</h2>
        <span class="admin-muted" id="dash-lessons-meta"></span>
      </div>
      <div class="admin-card">
        <div id="dashboard-lessons-list" class="dash-lessons">
          <div class="admin-empty">Loading lessons…</div>
        </div>
      </div>
    </section>

    <!-- Single support card -->
    <a href="#" class="dash-help whatsapp-support-link">
      <span class="dash-help-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
      </span>
      <span class="dash-help-text">
        <strong>Stuck on something?</strong>
        <span>Ask Thokerunga directly on WhatsApp</span>
      </span>
      <svg class="svg-icon dash-help-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </a>

  </main>

  <footer class="dash-footer">
    &copy; <span class="current-year">2026</span> Thokerunga Innocent &bull; <a href="terms.html">Terms</a> &bull; <a href="privacy.html">Privacy</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/course.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initDashboard();
    });
  </script>
</body>
</html>
