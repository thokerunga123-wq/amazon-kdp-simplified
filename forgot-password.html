<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Amazon KDP Simplified</title>
  <meta name="description" content="Reset your Amazon KDP Simplified course account password.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
</head>
<body class="admin-body login-body">

  <header class="admin-topbar">
    <div class="admin-topbar-inner student-topbar-inner">
      <a href="index.html" class="brand-logo admin-brand">
        <img src="assets/images/logo.webp" alt="KDP Simplified" class="brand-logo-img" width="460" height="132">
      </a>
      <div class="admin-topbar-actions">
        <a href="index.html" class="admin-link"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg><span>Back to login</span></a>
      </div>
    </div>
  </header>

  <main class="login-main login-main-single">
    <section class="login-card">
      <h1 id="reset-title">Reset your password</h1>
      <p class="login-sub" id="reset-subtitle">Enter your email and we'll send you a link to set a new password.</p>

      <div id="auth-alert" class="login-alert" role="alert" hidden></div>

      <!-- Step 1: request reset email -->
      <form id="request-reset-form" novalidate>
        <div class="login-field">
          <label for="reset-email">Email</label>
          <input type="email" id="reset-email" name="email" placeholder="you@example.com" required autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false">
        </div>
        <button type="submit" id="btn-request-reset" class="login-submit"><span class="login-submit-text">Send reset link</span><span class="login-spinner" aria-hidden="true"></span></button>
      </form>

      <!-- Step 2: set new password (after clicking the email link) -->
      <form id="update-password-form" hidden novalidate>
        <div class="login-field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" name="new-password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
        </div>
        <div class="login-field">
          <label for="confirm-new-password">Confirm new password</label>
          <input type="password" id="confirm-new-password" name="confirm-password" placeholder="Type it again" minlength="6" required autocomplete="new-password">
        </div>
        <button type="submit" id="btn-update-password" class="login-submit"><span class="login-submit-text">Save new password</span><span class="login-spinner" aria-hidden="true"></span></button>
      </form>

      <a href="#" class="login-help whatsapp-support-link" style="margin-top:1.25rem;">
        <span class="login-help-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg></span>
        <span><strong>Didn't get the email?</strong> Message us on WhatsApp</span>
      </a>
    </section>
  </main>

  <footer class="dash-footer">
    &copy; <span class="current-year">2026</span> Thokerunga Innocent &bull; <a href="terms.html">Terms</a> &bull; <a href="privacy.html">Privacy</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const requestForm = document.getElementById('request-reset-form');
      const updateForm = document.getElementById('update-password-form');
      const alertBox = document.getElementById('auth-alert');
      const title = document.getElementById('reset-title');
      const subtitle = document.getElementById('reset-subtitle');

      const show = (html, ok) => {
        alertBox.innerHTML = html;
        alertBox.classList.toggle('is-success', Boolean(ok));
        alertBox.hidden = false;
      };
      const loading = (btn, on, label) => {
        btn.disabled = on;
        btn.classList.toggle('is-loading', on);
        btn.querySelector('.login-submit-text').textContent = label;
      };
      const esc = (t) => String(t).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

      const isRecovery = window.location.hash.includes('type=recovery') || window.location.search.includes('type=recovery');
      if (isRecovery) {
        requestForm.hidden = true;
        updateForm.hidden = false;
        title.textContent = 'Choose a new password';
        subtitle.textContent = 'Use at least 6 characters.';
        document.getElementById('new-password').focus();
      } else {
        document.getElementById('reset-email').focus();
      }

      requestForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('reset-email').value.trim();
        const btn = document.getElementById('btn-request-reset');
        alertBox.hidden = true;
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          show('<strong>Please enter a valid email address.</strong>');
          return;
        }
        loading(btn, true, 'Sending…');
        try {
          await requestPasswordReset(email);
          show(`<strong>Check your email.</strong> If ${esc(email)} has an account, a reset link is on its way. Check your spam folder too.`, true);
          loading(btn, false, 'Send again');
        } catch (error) {
          show(`<strong>Couldn't send the link.</strong> ${esc(error.message || 'Please try again.')}`);
          loading(btn, false, 'Send reset link');
        }
      });

      updateForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('new-password').value;
        const p2 = document.getElementById('confirm-new-password').value;
        const btn = document.getElementById('btn-update-password');
        alertBox.hidden = true;
        if (p1.length < 6) { show('<strong>Use at least 6 characters.</strong>'); return; }
        if (p1 !== p2) { show('<strong>The two passwords don\'t match.</strong>'); return; }
        loading(btn, true, 'Saving…');
        try {
          await updatePassword(p1);
          show('<strong>Password updated.</strong> Taking you to login…', true);
          setTimeout(() => { window.location.href = 'index.html'; }, 1600);
        } catch (error) {
          show(`<strong>Couldn't save the password.</strong> ${esc(error.message || 'The link may have expired. Request a new one.')}`);
          loading(btn, false, 'Save new password');
        }
      });
    });
  </script>
</body>
</html>
