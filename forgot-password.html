<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Amazon KDP Simplified</title>
  <meta name="description" content="Reset your Amazon KDP Simplified course account password.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F5C542'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/></svg>">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span class="icon-inline" style="color:var(--accent-yellow);">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </span>
        <span>Amazon <span class="logo-accent">KDP</span> Simplified</span>
      </a>

      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline btn-sm">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          <span>Back to Login</span>
        </a>
      </div>
    </div>
  </header>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="icon-box" style="margin:0 auto 1rem auto; width:50px; height:50px;">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="16.5" r="1.5"></circle><path d="M21 2l-2 2m-1.5 1.5L14 9l-3-3L2 15l4 4 9-9 3.5-3.5z"></path></svg>
        </div>
        <h1 id="reset-title" style="font-size:1.75rem; margin-bottom:0.25rem;">Reset Password</h1>
        <p id="reset-subtitle" style="font-size:0.9rem; color:var(--text-secondary-dark);">
          Enter your registered email to receive a secure recovery link
        </p>
      </div>

      <div id="auth-alert" class="form-alert"></div>

      <!-- Mode 1: Request Reset Email -->
      <form id="request-reset-form">
        <div class="form-group">
          <label class="form-label" for="reset-email">Email Address</label>
          <input type="email" id="reset-email" class="form-input" placeholder="student@example.com" required autocomplete="email">
        </div>

        <button type="submit" id="btn-request-reset" class="btn btn-primary btn-block btn-lg" style="margin-top:1.5rem;">
          Send Reset Link
        </button>
      </form>

      <!-- Mode 2: Set New Password -->
      <form id="update-password-form" style="display:none;">
        <div class="form-group">
          <label class="form-label" for="new-password">New Password</label>
          <input type="password" id="new-password" class="form-input" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-new-password">Confirm New Password</label>
          <input type="password" id="confirm-new-password" class="form-input" placeholder="Repeat new password" minlength="6" required autocomplete="new-password">
        </div>

        <button type="submit" id="btn-update-password" class="btn btn-primary btn-block btn-lg" style="margin-top:1.5rem;">
          Update Password
        </button>
      </form>

      <div class="auth-footer" style="margin-top:1.5rem;">
        <p><a href="index.html">← Return to Login</a></p>
      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container" style="text-align:center; font-size:0.8125rem; color:var(--text-muted-dark);">
      &copy; <span class="current-year">2026</span> Thokerunga Innocent. Amazon KDP Simplified.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const requestForm = document.getElementById('request-reset-form');
      const updateForm = document.getElementById('update-password-form');
      const alertBox = document.getElementById('auth-alert');
      const resetTitle = document.getElementById('reset-title');
      const resetSubtitle = document.getElementById('reset-subtitle');

      const isRecovery = window.location.hash.includes('type=recovery') || window.location.search.includes('type=recovery');

      if (isRecovery) {
        requestForm.style.display = 'none';
        updateForm.style.display = 'block';
        resetTitle.textContent = 'Set New Password';
        resetSubtitle.textContent = 'Please choose a new password for your account';
      }

      requestForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('reset-email').value.trim();
        const submitBtn = document.getElementById('btn-request-reset');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending link...';
        alertBox.style.display = 'none';

        try {
          await requestPasswordReset(email);
          alertBox.className = 'form-alert alert-success';
          alertBox.textContent = `A reset link has been dispatched to ${email}.`;
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Reset Link';
        } catch (error) {
          alertBox.className = 'form-alert alert-error';
          alertBox.textContent = error.message || 'Unable to process reset request.';
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Reset Link';
        }
      });

      updateForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPass = document.getElementById('new-password').value;
        const confirmPass = document.getElementById('confirm-new-password').value;
        const submitBtn = document.getElementById('btn-update-password');

        if (newPass !== confirmPass) {
          alertBox.className = 'form-alert alert-error';
          alertBox.textContent = 'Passwords do not match.';
          alertBox.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating...';
        alertBox.style.display = 'none';

        try {
          await updatePassword(newPass);
          alertBox.className = 'form-alert alert-success';
          alertBox.textContent = 'Password updated! Redirecting to login...';
          alertBox.style.display = 'block';
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1800);
        } catch (error) {
          alertBox.className = 'form-alert alert-error';
          alertBox.textContent = error.message || 'Failed to update password.';
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
        }
      });
    });
  </script>
</body>
</html>
